[project]
name = "llm-engineering"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69.0",
    "beautifulsoup4>=4.14.2",
    "chromadb>=1.1.0",
    "datasets==3.6.0",
    "feedparser>=6.0.12",
    "google-genai>=1.41.0",
    "google-generativeai>=0.8.5",
    "gradio>=5.47.2,<6.0",
    "ipykernel>=6.30.1",
    "ipywidgets>=8.1.7",
    "jupyter-dash>=0.4.2",
    "langchain>=0.3.27",
    "langchain-chroma>=0.2.6",
    "langchain-community>=0.3.30",
    "langchain-core>=0.3.76",
    "langchain-openai>=0.3.33",
    "langchain-text-splitters>=0.3.11",
    "litellm>=1.77.5",
    "matplotlib>=3.10.6",
    "nbformat>=5.10.4",
    "modal>=1.1.4",
    "numpy>=2.3.3",
    "ollama>=0.6.0",
    "openai>=1.109.1",
    "pandas>=2.3.3",
    "plotly>=6.3.0",
    "protobuf==3.20.2",
    "psutil>=7.1.0",
    "pydub>=0.25.1",
    "python-dotenv>=1.1.1",
    "requests>=2.32.5",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.2",
    "sentence-transformers>=5.1.1",
    "setuptools>=80.9.0",
    "speedtest-cli>=2.1.3",
    "tiktoken>=0.11.0",
    "torch>=2.8.0",
    "tqdm>=4.67.1",
    "transformers>=4.56.2",
    "wandb>=0.22.1",
    "langchain-huggingface>=1.0.0",
    "langchain-ollama>=1.0.0",
    "langchain-anthropic>=1.0.1",
    "langchain-experimental>=0.0.42",
    "groq>=0.33.0",
    "xgboost>=3.1.1",
]

# =============================================================================
# RUFF — Python linter & formatter
# =============================================================================

[tool.ruff]
line-length = 180
exclude = ["__pycache__", "venv", ".tox", ".venv", "tests.py", "env"]

[tool.ruff.lint]
select = ["E", "F", "B"]
ignore = ["E203", "E501", "E701", "E401", "B008"]


# =============================================================================
# TOX — Test & task runner
# =============================================================================

# Default envs run when you type `tox` with no arguments
[tool.tox]
env_list = ["lint", "txt-lint", "format", "prettier", "toml-lint"]
work_dir = "/tmp/.tox"

# Shared base config inherited by all envs
[tool.tox.env_run_base]
pass_env = ["PATH"]
set_env = { VIRTUALENV_OVERRIDE_APP_DATA = "{work_dir}/.virtualenv" }

# --- Linting ----------------------------------------------------------------

[tool.tox.env.lint]
skip_install = true
base_python = "python3"
deps = ["ruff"]
commands = [["ruff", "check", "--no-cache", "."]]

[tool.tox.env."txt-lint"]
skip_install = true
allowlist_externals = ["npx", "npm"]
commands = [
  [
    "npm",
    "install",
    "--save-dev",
    "textlint",
    "textlint-rule-common-misspellings",
    "textlint-rule-write-good",
  ],
  [
    "npx",
    "textlint",
    "--rule",
    "common-misspellings",
    "--rule",
    "write-good",
    "**/*.txt",
  ],
]


# --- Formatting -------------------------------------------------------------

[tool.tox.env.format]
skip_install = true
deps = ["ruff", "ty"]
allowlist_externals = ["npx"]
commands = [
  [
    "ruff",
    "format",
    "--no-cache",
    "--verbose",
    ".",
  ],
  [
    "ruff",
    "check",
    "--no-cache",
    "--fix",
    "--verbose",
    ".",
  ],
  [
    "npx",
    "prettier",
    "--write",
    "--log-level",
    "log",
    "**/*.{css,js,html,json,yml,yaml,md}",
  ],
  [
    "npx",
    "@taplo/cli",
    "fmt",
    "--no-auto-config",
    "**/*.toml",
  ],
]

[tool.tox.env.prettier]
skip_install = true
allowlist_externals = ["npx"]
commands = [
  [
    "npx",
    "prettier",
    "--check",
    "**/*.{css,js,html,json,yml,yaml,md}",
  ],
]

[tool.tox.env."toml-lint"]
skip_install = true
allowlist_externals = ["npx"]
commands = [
  [
    "npx",
    "@taplo/cli",
    "fmt",
    "--check",
    "--no-auto-config",
    "**/*.toml",
  ],
  [
    "npx",
    "@taplo/cli",
    "lint",
    "--no-auto-config",
    "**/*.toml",
  ],
]


# --- Aggregate (CI) ---------------------------------------------------------

# Runs the full CI chain: no-classes-check → lint → txt-lint → prettier → tests
[tool.tox.env.all]
skip_install = true
deps = []
allowlist_externals = ["tox"]
commands = [
  
  [
    "tox",
    "-e",
    "format",
  ],
  [
    "tox",
    "-e",
    "lint",
  ],
  [
    "tox",
    "-e",
    "txt-lint",
  ],
  [
    "tox",
    "-e",
    "prettier",
  ],
  [
    "tox",
    "-e",
    "toml-lint",
  ],
]